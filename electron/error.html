<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Startup Error — Legal OS</title>
  <style>
    body {
      margin: 0;
      background: #060e1c;
      color: #f0ede8;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .box {
      max-width: 480px;
      padding: 40px;
    }
    h1 { color: #c9a84c; font-size: 1.5rem; margin-bottom: 12px; }
    p { color: #8a92a6; font-size: 0.9rem; line-height: 1.6; }
    button {
      margin-top: 24px;
      background: linear-gradient(135deg, #c9a84c, #edd98b);
      color: #060e1c;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>⚠️ Could not start Legal OS</h1>
    <p>The backend service failed to start. This is usually a port conflict or a missing dependency.</p>
    <p style="margin-top:12px; font-family:monospace; font-size:0.78rem; background:rgba(255,255,255,0.05); padding:12px; border-radius:6px;">
      Try closing any other running instances of Legal OS and relaunch.
    </p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
